<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لا يوجد اتصال — مؤسسة الرفاعي ERP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, #1e1b22 0%, #161419 55%, #09080a 100%);
    font-family: 'Tajawal', -apple-system, sans-serif;
    color: #f5e8d0;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  .icon-wrap {
    width: 96px; height: 96px; margin: 0 auto 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, #1e1b22, #09080a);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(232,184,74,0.15);
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #f0c97a; }
  p { font-size: 15px; line-height: 1.8; color: #cbb990; margin-bottom: 24px; }
  button {
    background: linear-gradient(135deg, #f0c97a, #d4a030);
    color: #09080a; border: none; padding: 12px 32px;
    border-radius: 10px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .hint { margin-top: 18px; font-size: 13px; color: #a89070; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#e8b84a" stroke-width="1.5">
        <path d="M12 2 L12 6 M5 9 Q3 13 5 17 M19 9 Q21 13 19 17 M6 17 L6 19 A2 2 0 0 0 8 21 L16 21 A2 2 0 0 0 18 19 L18 17" stroke-linecap="round"/>
        <circle cx="6" cy="18" r="1.6" fill="#e8b84a" stroke="none"/>
        <circle cx="12" cy="19.5" r="2" fill="#e8b84a" stroke="none"/>
        <circle cx="18" cy="18" r="1.6" fill="#e8b84a" stroke="none"/>
      </svg>
    </div>
    <h1>لا يوجد اتصال بالإنترنت حالياً</h1>
    <p>
      التطبيق يحتاج اتصالاً بالإنترنت للوصول لبياناتك (المنتجات، الفواتير،
      المخزون...). تأكد من اتصالك وحاول مرة أخرى.
    </p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <div class="hint">لن يتم فقد أي بيانات — النظام لا يخزّن العمليات المالية محلياً لضمان دقتها دائماً.</div>
  </div>
</body>
</html>
