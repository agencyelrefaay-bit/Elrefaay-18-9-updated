# nginx.conf — reverse proxy لنظام نجف وإضاءة ERP
# انسخه لـ /etc/nginx/sites-available/najaf-erp على السيرفر، واعمل symlink
# لـ sites-enabled، وعدّل server_name للنطاق الحقيقي.
#
# ── تفعيل SSL (بعد التأكد إن الموقع شغال بنجاح على HTTP الأول) ──
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d erp.alrifai-lighting.com
# certbot هيعدّل هذا الملف تلقائياً ويضيف بلوك HTTPS + إعادة توجيه HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name erp.alrifai-lighting.com;  # ← غيّرها للنطاق الحقيقي

    client_max_body_size 15M;  # يسمح برفع صور المنتجات (السيرفر نفسه بيحدد 10MB في multer)

    # ضغط الاستجابات النصية (JSON/HTML/CSS/JS) لتقليل حجم النقل
    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    # ─── الملفات الثابتة (صور المنتجات) — تُقدَّم مباشرة من Nginx بدل ما تمر
    # على Node، أسرع بكتير وبتقلل الحمل على السيرفر ───
    location /uploads/ {
        alias /app/src/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── كل الباقي (API + الفرونت اند الـ SPA) يمرّ على Node ───
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # تعطيل الوصول لأي ملف .env أو .git لو حصل غلط ووقع جوه مسار مقدَّم
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }
}
